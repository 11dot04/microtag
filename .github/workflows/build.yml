name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # --- PERSISTENT KEYSTORE ENGINE ---
      - name: Setup Persistent Signing Keystore
        run: |
          mkdir -p keystore
          KEYSTORE_PATH="keystore/signing.jks"

          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "No persistent keystore found. Generating new deterministic keystore..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Microtag, OU=Android, O=Microtag, L=Unknown, ST=Unknown, C=US"

            echo "Keystore created. Committing to repository via bot..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add "$KEYSTORE_PATH"
            git commit -m "ci: persist app signing keystore [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Found existing persistent keystore in repository. Skipping generation."
          fi

          mkdir -p ~/.android
          cp "$KEYSTORE_PATH" ~/.android/debug.keystore
          echo "Keystore mounted to ~/.android/debug.keystore successfully."

      # AGP 9 needs Gradle 9; the runner's own Gradle is older. Also add the newest platform (compileSdk 37).
      - name: Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: microtag-debug
          path: app/build/outputs/apk/debug/*.apk
